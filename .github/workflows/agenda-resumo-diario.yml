name: Agenda — Resumo Diário WhatsApp

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 horário de Brasília (UTC-3)
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar edge function agenda-cron
        run: |
          curl -s -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://mpueyricnfkyobjaviph.supabase.co/functions/v1/agenda-cron \
            -w "\nHTTP %{http_code}"
