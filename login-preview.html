<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VargasTI - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .login-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #04060e;
      display: flex;
      overflow: hidden;
    }

    .left-side {
      flex: 1;
      background: linear-gradient(135deg, #04060e 0%, #0f192d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .left-content {
      text-align: center;
      color: white;
      max-width: 400px;
      padding: 2rem;
    }

    .logo-svg {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
    }

    .left-content h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #13c8d3 0%, #0088ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .left-content p {
      font-size: 1.1rem;
      color: #b0c4de;
      line-height: 1.6;
    }

    .right-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .form-card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      background: rgba(15, 25, 45, 0.95);
      border: 1px solid rgba(19, 200, 211, 0.4);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      color: white;
    }

    .form-card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f4f8fb;
      margin: 0 0 0.5rem 0;
    }

    .form-card > p {
      font-size: 0.9rem;
      color: #b0c4de;
      margin: 0 0 1.5rem 0;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
    }

    .btn-google {
      background: transparent;
      border: 1px solid rgba(19, 200, 211, 0.3);
      color: #f4f8fb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-google:hover {
      border-color: rgba(19, 200, 211, 0.6);
      background: rgba(19, 200, 211, 0.05);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      opacity: 0.5;
      margin-bottom: 1.5rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(19, 200, 211, 0.2);
    }

    .divider-text {
      font-size: 0.85rem;
      color: #b0c4de;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #b0c4de;
      margin-bottom: 0.5rem;
    }

    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      background: rgba(20, 30, 50, 0.6);
      border: 1px solid rgba(19, 200, 211, 0.3);
      border-radius: 8px;
      color: #f4f8fb;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    .form-group input[type="email"]:focus,
    .form-group input[type="password"]:focus {
      outline: none;
      border-color: rgba(19, 200, 211, 0.6);
      background: rgba(20, 30, 50, 0.8);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input[type="password"],
    .password-wrapper input[type="text"] {
      padding-right: 2.5rem;
    }

    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #b0c4de;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: #b0c4de;
      margin-bottom: 1.5rem;
    }

    .remember-me input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
      accent-color: #13c8d3;
    }

    .btn-submit {
      background: linear-gradient(90deg, #13c8d3 0%, #0088ff 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .footer-text {
      margin: 0;
      text-align: center;
      font-size: 0.9rem;
      color: #b0c4de;
    }

    .footer-text a {
      color: #13c8d3;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .login-container {
        flex-direction: column;
      }

      .left-side {
        padding: 2rem;
        min-height: 40vh;
      }

      .right-side {
        min-height: 60vh;
      }
    }

    @media (max-width: 600px) {
      .form-card {
        padding: 1.5rem;
      }

      .form-card h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Left side -->
    <div class="left-side">
      <div class="left-content">
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#13c8d3;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="traceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#13c8d3;stop-opacity:0.8" />
              <stop offset="100%" style="stop-color:#0088ff;stop-opacity:0.6" />
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- V shape -->
          <path d="M 25 20 L 50 70 L 75 20" stroke="url(#vGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- Traces -->
          <line x1="20" y1="20" x2="20" y2="45" stroke="url(#traceGrad)" stroke-width="2" filter="url(#glow)"/>
          <line x1="20" y1="45" x2="35" y2="45" stroke="url(#traceGrad)" stroke-width="2"/>

          <line x1="35" y1="20" x2="35" y2="50" stroke="url(#traceGrad)" stroke-width="2" filter="url(#glow)"/>
          <line x1="35" y1="50" x2="45" y2="50" stroke="url(#traceGrad)" stroke-width="2"/>

          <line x1="50" y1="20" x2="50" y2="70" stroke="url(#traceGrad)" stroke-width="2" filter="url(#glow)"/>

          <line x1="65" y1="20" x2="65" y2="50" stroke="url(#traceGrad)" stroke-width="2" filter="url(#glow)"/>
          <line x1="55" y1="50" x2="65" y2="50" stroke="url(#traceGrad)" stroke-width="2"/>

          <line x1="80" y1="20" x2="80" y2="45" stroke="url(#traceGrad)" stroke-width="2" filter="url(#glow)"/>
          <line x1="65" y1="45" x2="80" y2="45" stroke="url(#traceGrad)" stroke-width="2"/>

          <!-- Nodes -->
          <circle cx="20" cy="20" r="2" fill="#13c8d3" filter="url(#glow)"/>
          <circle cx="35" cy="20" r="2" fill="#0088ff"/>
          <circle cx="50" cy="20" r="2.5" fill="#13c8d3" filter="url(#glow)"/>
          <circle cx="65" cy="20" r="2" fill="#0088ff"/>
          <circle cx="80" cy="20" r="2" fill="#13c8d3" filter="url(#glow)"/>
          <circle cx="20" cy="45" r="1.5" fill="#0088ff"/>
          <circle cx="50" cy="70" r="2" fill="#13c8d3" filter="url(#glow)"/>
          <circle cx="80" cy="45" r="1.5" fill="#0088ff"/>
        </svg>
        <h2>VargasTI</h2>
        <p>Soluções que conectam, suporte que transforma</p>
      </div>
    </div>

    <!-- Right side -->
    <div class="right-side">
      <form class="form-card">
        <h1>Bem-vindo de volta!</h1>
        <p>Informe seu e-mail e senha para acessar o sistema.</p>

        <button type="button" class="btn btn-google">
          <span>G</span>
          Entrar com Google
        </button>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">ou</span>
          <div class="divider-line"></div>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Digite seu e-mail" />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Digite sua senha" />
            <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
          </div>
        </div>

        <label class="remember-me">
          <input type="checkbox" />
          Lembrar-me
        </label>

        <button type="submit" class="btn btn-submit">
          <span>→</span>
          Entrar
        </button>

        <p class="footer-text">
          Não tem conta? <a href="#">Criar conta</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = document.querySelector('.password-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '👁️';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    document.querySelector('.btn-submit').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Demo: Login enviado!');
    });
  </script>
</body>
</html>
